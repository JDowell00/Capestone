<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phishing Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #050816;
        --bg-alt: #0b1020;
        --accent: #4ade80;
        --accent-soft: rgba(74, 222, 128, 0.12);
        --accent-danger: #fb7185;
        --accent-danger-soft: rgba(248, 113, 113, 0.14);
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-subtle: rgba(148, 163, 184, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12px 14px 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
        color: var(--text-main);
        min-width: 320px;
      }

      .card {
        border-radius: 14px;
        padding: 12px 13px 13px;
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(12, 10, 24, 0.98));
        border: 1px solid rgba(148, 163, 184, 0.4);
        box-shadow:
          0 18px 45px rgba(15, 23, 42, 0.85),
          0 0 0 1px rgba(15, 23, 42, 0.5);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        column-gap: 8px;
        margin-bottom: 8px;
      }

      .title {
        display: flex;
        align-items: center;
        column-gap: 6px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .title-badge {
        width: 20px;
        height: 20px;
        border-radius: 8px;
        background: radial-gradient(circle at 30% 20%, #4ade80 0, #22c55e 28%, #14b8a6 60%, #0284c7 95%);
        box-shadow:
          0 0 0 1px rgba(34, 197, 94, 0.6),
          0 0 16px rgba(56, 189, 248, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #022c22;
        font-size: 11px;
        font-weight: 700;
      }

      .title span:last-child {
        font-size: 14px;
      }

      .pill {
        font-size: 10px;
        padding: 3px 7px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.7);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.09em;
        display: inline-flex;
        align-items: center;
        column-gap: 4px;
      }

      .pill-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.35);
      }

      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        padding: 8px 9px;
        background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.85));
        color: var(--text-main);
        font-size: 12px;
        line-height: 1.4;
        outline: none;
        transition:
          border-color 120ms ease-out,
          box-shadow 120ms ease-out,
          background 120ms ease-out;
      }

      textarea::placeholder {
        color: #4b5563;
      }

      textarea:focus {
        border-color: rgba(74, 222, 128, 0.8);
        box-shadow:
          0 0 0 1px rgba(74, 222, 128, 0.7),
          0 0 0 6px rgba(34, 197, 94, 0.2);
        background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.98), rgba(17, 24, 39, 0.96));
      }

      .actions-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        margin-bottom: 8px;
        column-gap: 8px;
      }

      .secondary-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      button {
        border-radius: 999px;
        border: none;
        padding: 6px 11px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        column-gap: 6px;
        white-space: nowrap;
        transition:
          transform 120ms ease-out,
          box-shadow 120ms ease-out,
          background 120ms ease-out,
          color 120ms ease-out,
          border-color 120ms ease-out;
      }

      .btn-ghost {
        background: rgba(15, 23, 42, 0.4);
        color: var(--text-muted);
        border: 1px solid rgba(148, 163, 184, 0.5);
      }

      .btn-ghost:hover {
        background: rgba(15, 23, 42, 0.8);
        color: var(--text-main);
        border-color: rgba(148, 163, 184, 0.9);
        transform: translateY(-0.5px);
      }

      .btn-primary {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #022c22;
        box-shadow:
          0 9px 22px rgba(34, 197, 94, 0.45),
          0 0 0 1px rgba(5, 46, 22, 0.95);
        padding-inline: 14px;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #4ade80, #22c55e);
        transform: translateY(-0.6px) translateZ(0);
        box-shadow:
          0 12px 30px rgba(34, 197, 94, 0.6),
          0 0 0 1px rgba(5, 46, 22, 1);
      }

      .btn-icon {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.9);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
      }

      .result-chip {
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        column-gap: 6px;
        border: 1px solid var(--border-subtle);
        background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.9));
        color: var(--text-muted);
      }

      .result-pill {
        padding: 3px 7px;
        border-radius: 999px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .result-pill.safe {
        background: var(--accent-soft);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.75);
      }

      .result-pill.warning {
        background: rgba(253, 224, 71, 0.08);
        color: #facc15;
        border: 1px solid rgba(234, 179, 8, 0.7);
      }

      .result-pill.danger {
        background: var(--accent-danger-soft);
        color: var(--accent-danger);
        border: 1px solid rgba(248, 113, 113, 0.7);
      }

      .score {
        font-variant-numeric: tabular-nums;
        color: var(--text-main);
      }

      .result-meta {
        display: flex;
        align-items: center;
        column-gap: 6px;
      }

      .result-meta small {
        font-size: 10px;
        color: var(--text-muted);
      }

      .reasons {
        margin-top: 8px;
        font-size: 11px;
        color: var(--text-muted);
      }

      .reason-item {
        display: flex;
        align-items: flex-start;
        column-gap: 6px;
        margin-bottom: 3px;
      }

      .reason-dot {
        margin-top: 4px;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.85);
      }

      .footer {
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 9px;
        color: var(--text-muted);
        opacity: 0.8;
      }

      .footer a {
        color: #38bdf8;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .badge-risk {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--text-muted);
      }

      .badge-risk span {
        font-weight: 600;
      }

      .badge-risk span.safe {
        color: #4ade80;
      }

      .badge-risk span.warning {
        color: #facc15;
      }

      .badge-risk span.danger {
        color: var(--accent-danger);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="title">
          <div class="title-badge">PD</div>
          <span>Phishing Detector</span>
        </div>
        <div class="pill">
          <span class="pill-dot"></span>
          <span>Live scan</span>
        </div>
      </div>

      <div class="field">
        <label for="emailText">Email content</label>
        <textarea
          id="emailText"
          placeholder="Paste the email text here, or use 'Use selection from page' to analyze highlighted content from Gmail, Outlook, etc."
        ></textarea>
      </div>

      <div class="actions-row">
        <div class="secondary-actions">
          <button class="btn-ghost" id="useSelectionBtn" type="button">
            <span class="btn-icon">↘</span>
            <span>Use selection from page</span>
          </button>
          <button class="btn-ghost" id="clearBtn" type="button">
            <span class="btn-icon">✕</span>
            <span>Clear</span>
          </button>
        </div>
        <button class="btn-primary" id="analyzeBtn" type="button">
          <span class="btn-icon">⚡</span>
          <span>Scan for phishing</span>
        </button>
      </div>

      <div id="result" aria-live="polite">
        <div class="result-chip">
          <span class="result-pill safe" id="riskPill">Waiting</span>
          <div class="result-meta">
            <span class="score" id="scoreLabel">Score: – / 100</span>
            <small id="summaryLabel">Paste an email to get a risk assessment.</small>
          </div>
        </div>
        <div class="badge-risk" id="riskBadge">
          Overall risk: <span class="safe">none yet</span>
        </div>
        <div class="reasons" id="reasons"></div>
      </div>

      <div class="footer">
        <span>Heuristic only — be cautious with real emails.</span>
        <span>Built for GitHub / personal use</span>
      </div>
    </div>

    <script src="phishingClassifier.js"></script>
    <script src="popup.js"></script>
  </body>
  </html>
